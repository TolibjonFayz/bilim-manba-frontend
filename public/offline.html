<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internet yo'q — Bilim Manba</title>
    <meta name="theme-color" content="#5850ec" />
    <link rel="icon" href="/favicon-32x32.png" />
    <style>
      :root {
        --bg: #f7f7fb;
        --card: #ffffff;
        --text: #16162a;
        --muted: #6b6b80;
        --border: #e6e6f0;
        --primary: #5850ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12121c;
          --card: #1c1c2a;
          --text: #ececf4;
          --muted: #a0a0b8;
          --border: #2c2c40;
          --primary: #8b85ff;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 3rem 16px;
      }
      main {
        width: 100%;
        max-width: 560px;
      }
      .emoji {
        font-size: 3rem;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0.75rem 0 0.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
      }
      h2 {
        font-size: 1rem;
        margin: 2.25rem 0 0.75rem;
      }
      ul {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      a {
        display: block;
        padding: 0.8rem 1rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
        line-height: 1.4;
      }
      a:hover {
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="emoji">📡</div>
      <h1>Internet aloqasi yo'q</h1>
      <p>
        Bu sahifa hali saqlanmagan. Internet qaytgach, qayta urinib ko'ring.
        Avval ochgan maqolalaringizni esa hozir ham o'qishingiz mumkin.
      </p>
      <button type="button" onclick="location.reload()">🔄 Qayta urinish</button>

      <section id="saved" hidden>
        <h2>📚 Internetsiz o'qish mumkin</h2>
        <ul id="list"></ul>
      </section>
    </main>
    <script>
      // Service worker saqlagan sahifalar ro'yxati (sarlavhasi HTML'dan olinadi)
      (async () => {
        try {
          const names = (await caches.keys()).filter((k) => k.startsWith("bm-pages-"));
          if (!names.length) return;
          const cache = await caches.open(names[0]);
          const keys = (await cache.keys()).reverse();
          const list = document.getElementById("list");
          for (const req of keys) {
            const url = new URL(req.url);
            if (!url.pathname.startsWith("/articles/")) continue;
            const html = await (await cache.match(req)).text();
            const m = /<title>([^<]*)<\/title>/i.exec(html);
            const t = document.createElement("textarea");
            t.innerHTML = m ? m[1].replace(/\s+—\s+Bilim Manba$/, "") : url.pathname;
            const a = document.createElement("a");
            a.href = url.pathname;
            a.textContent = t.value;
            const li = document.createElement("li");
            li.appendChild(a);
            list.appendChild(li);
          }
          if (list.children.length) document.getElementById("saved").hidden = false;
        } catch {}
      })();
    </script>
  </body>
</html>
